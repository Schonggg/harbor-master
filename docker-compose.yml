# Cloud object storage (MinIO):
#   docker compose --profile cloud up --build
# Then point the app at it:
#   S3_BUCKET=harbormaster
#   S3_ENDPOINT=http://minio:9000
#   S3_ACCESS_KEY=harbormaster
#   S3_SECRET_KEY=harbormasterdev
#   S3_FORCE_PATH_STYLE=true

services:
  harbormaster:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HARBORMASTER_ENV: prod
      DATA_DIR: /app/data
      DB_PATH: /app/data/harbormaster.db
      INBOX_BASE_URL: ${INBOX_BASE_URL:-http://localhost:8080}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-harbormaster/}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - hm-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    profiles: ["cloud"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: harbormaster
      MINIO_ROOT_PASSWORD: harbormasterdev
    volumes:
      - hm-minio:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    profiles: ["cloud"]
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 harbormaster harbormasterdev;
      mc mb --ignore-existing local/harbormaster;
      exit 0
      "

volumes:
  hm-data:
  hm-minio:
