[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harbormaster"
version = "1.2.0"
description = "Maritime document discrepancy court — three-state verdicts, deterministic judgment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harbormaster Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pdfplumber>=0.11.4",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "openai>=1.54.0",
    "structlog>=24.4.0",
    "pillow>=10.4.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[project.scripts]
harbormaster = "harbormaster.api.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.scripts]
build = "python scripts/vercel_build.py"

[tool.setuptools.package-data]
harbormaster = ["ledger/schema.sql", "ledger/schema.pg.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
